databases:
  - name: lead-tracker-db
    plan: free
    databaseName: lead_tracker
    user: lead_tracker

services:
  # FastAPI backend, built from backend/Dockerfile. Runs Alembic
  # migrations before starting uvicorn (see the CMD in the Dockerfile).
  - type: web
    name: lead-tracker-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lead-tracker-db
          property: connectionString
      # Update this to the deployed frontend URL after the first deploy
      # (see README > Deployment Steps).
      - key: CORS_ORIGINS
        value: https://lead-tracker-frontend.onrender.com

  # Static React build, served by Render's static site host.
  - type: web
    name: lead-tracker-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Update this to the deployed backend URL after the first deploy
      # (see README > Deployment Steps). VITE_API_URL is baked into the
      # build, so changing it requires a redeploy of this service.
      - key: VITE_API_URL
        value: https://lead-tracker-api.onrender.com
    routes:
      # Client-side routing fallback (not strictly needed for this
      # single-page app today, but harmless and future-proof).
      - type: rewrite
        source: /*
        destination: /index.html
